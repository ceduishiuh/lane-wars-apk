name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-unzip uploaded project archive (if zipped)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No settings.gradle.kts or .zip archive found. Upload the downloaded .zip file directly to your repository root."
              exit 1
            fi
            echo "Found archive $ZIP_FILE — extracting..."
            unzip -oq "$ZIP_FILE" || python3 -m zipfile -e "$ZIP_FILE" .
          fi

      - name: Verify Android project files
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/assets/index.html app/src/main/assets/style.css app/src/main/assets/game.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f. Ensure the downloaded Android APK project .zip is in your repository root."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at: $SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          for h in 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee; do
            grep -qxF "$h" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || echo "$h" >> "$SDK_DIR/licenses/android-sdk-license"
          done
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lane-wars-5v5-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK (Debug-Signed for Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: lane-wars-5v5-offline-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
