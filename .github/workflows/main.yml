name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lane-wars-5v5-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK (Debug-Signed for Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: lane-wars-5v5-offline-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
